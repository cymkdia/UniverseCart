# M6 — web/share → GitHub Pages (친구용 공유 위시리스트)
# 저장소 Secrets: SUPABASE_URL, SUPABASE_ANON_KEY (앱 plist와 동일)

name: Deploy share web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "web/share/**"
      - ".github/workflows/deploy-share-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config.js for Pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::GitHub Secrets에 SUPABASE_URL, SUPABASE_ANON_KEY를 추가해 주세요."
            exit 1
          fi
          cat > web/share/config.js <<EOF
          window.UNIVERSE_CART_CONFIG = {
            SUPABASE_URL: "${SUPABASE_URL}",
            SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}",
          };
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/share

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
