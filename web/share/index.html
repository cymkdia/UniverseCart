<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Universe Cart · 위시리스트</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff;
        color: #19191a;
        padding: 24px 16px 48px;
      }
      .wrap { max-width: 420px; margin: 0 auto; }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #5d5d5d;
        margin-bottom: 6px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin-bottom: 16px;
      }
      .summary {
        background: #f4f4f4;
        border: 1px solid #e4e4e4;
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 14px;
        color: #5d5d5d;
        margin-bottom: 20px;
      }
      .summary strong { color: #19191a; }
      .list { display: flex; flex-direction: column; gap: 0; }
      .item {
        padding: 14px 0;
        border-bottom: 1px solid #e4e4e4;
      }
      .item-top {
        display: flex;
        gap: 12px;
      }
      .thumb {
        width: 68px;
        height: 68px;
        border-radius: 6px;
        background: #f4f4f4;
        flex-shrink: 0;
        overflow: hidden;
      }
      .thumb img { width: 100%; height: 100%; object-fit: cover; }
      .body { flex: 1; min-width: 0; }
      .meta {
        font-size: 11px;
        color: #5d5d5d;
        margin-bottom: 4px;
      }
      .title {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.35;
        margin-bottom: 6px;
      }
      .price { font-size: 13px; font-weight: 600; }
      .fund-block {
        margin-top: 12px;
        padding: 12px;
        background: #f7f6f3;
        border-radius: 8px;
      }
      .fund-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 6px;
      }
      .fund-label {
        font-size: 10px;
        color: #b8b5ae;
        font-weight: 600;
        letter-spacing: 0.3px;
        text-transform: uppercase;
      }
      .fund-pct {
        font-size: 18px;
        font-weight: 700;
        color: #19191a;
      }
      .fund-bar {
        height: 6px;
        background: #f0eee8;
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 8px;
      }
      .fund-fill {
        height: 100%;
        background: #7baf92;
        border-radius: 3px;
      }
      .fund-meta {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        margin-bottom: 10px;
      }
      .fund-collected { color: #3a8c5c; font-weight: 600; }
      .fund-remaining { color: #c0bdb6; }
      .fund-participants {
        font-size: 11px;
        color: #6b6b6b;
        margin-bottom: 10px;
        line-height: 1.45;
      }
      .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
      .btn {
        appearance: none;
        border: none;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .btn-primary {
        background: #19191a;
        color: #fff;
        flex: 1;
      }
      .btn-secondary {
        background: #fff;
        color: #19191a;
        border: 1px solid #e4e4e4;
      }
      .muted { color: #5d5d5d; font-weight: 400; }
      .state {
        text-align: center;
        padding: 48px 12px;
        color: #5d5d5d;
        font-size: 14px;
        line-height: 1.5;
      }
      .error { color: #d53f00; }
      footer {
        margin-top: 28px;
        text-align: center;
        font-size: 11px;
        color: #a0a0a0;
        line-height: 1.5;
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 100;
        padding: 16px;
      }
      .overlay.open { display: flex; }
      .sheet {
        width: 100%;
        max-width: 420px;
        max-height: 90vh;
        overflow-y: auto;
        background: #fff;
        border-radius: 14px 14px 10px 10px;
        padding: 20px 18px 24px;
      }
      .sheet h2 {
        font-size: 17px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .sheet-sub {
        font-size: 12px;
        color: #6b6b6b;
        line-height: 1.5;
        margin-bottom: 16px;
      }
      .field { margin-bottom: 12px; }
      .field label {
        display: block;
        font-size: 11px;
        color: #6b6b6b;
        margin-bottom: 6px;
        font-weight: 600;
      }
      .field input,
      .field textarea {
        width: 100%;
        border: 1px solid #e4e4e4;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
        font-family: inherit;
      }
      .field textarea { min-height: 72px; resize: vertical; }
      .amount-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 12px;
      }
      .amt-chip {
        border: 1px solid #e4e4e4;
        border-radius: 8px;
        padding: 10px;
        text-align: center;
        cursor: pointer;
        background: #fff;
      }
      .amt-chip.on {
        border-color: #19191a;
        background: #fafaf8;
      }
      .amt-val { font-size: 14px; font-weight: 700; }
      .amt-label { font-size: 9px; color: #c0bdb6; margin-top: 2px; }
      .amt-chip.on .amt-label { color: #888; }
      .auth-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      .auth-tab {
        flex: 1;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #e4e4e4;
        background: #fff;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .auth-tab.on {
        border-color: #19191a;
        background: #fafaf8;
      }
      .form-error {
        color: #d53f00;
        font-size: 12px;
        margin-bottom: 10px;
        line-height: 1.4;
      }
      .form-success {
        color: #3a8c5c;
        font-size: 12px;
        margin-bottom: 10px;
      }
      .sheet-close {
        float: right;
        border: none;
        background: none;
        font-size: 20px;
        color: #888;
        cursor: pointer;
        line-height: 1;
      }
      .session-bar {
        font-size: 11px;
        color: #6b6b6b;
        margin-bottom: 14px;
        padding: 8px 10px;
        background: #f4f4f4;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="eyebrow">Universe Cart</div>
      <h1 id="ownerTitle">위시리스트</h1>
      <div class="summary" id="summary">불러오는 중…</div>
      <div id="content" class="state">잠시만 기다려 주세요.</div>
      <footer>
        공개된 위시리스트만 표시됩니다.<br />
        약속 펀딩은 금액·메시지 기록만 하며, UC는 결제를 받지 않아요.
      </footer>
    </div>

    <div class="overlay" id="overlay" aria-hidden="true">
      <div class="sheet" role="dialog" aria-modal="true">
        <button type="button" class="sheet-close" id="closeSheet" aria-label="닫기">×</button>
        <h2 id="sheetTitle">같이 선물하기</h2>
        <p class="sheet-sub" id="sheetSub"></p>
        <div id="sheetBody"></div>
      </div>
    </div>

    <script>
      (function () {
        function fail(message) {
          document.getElementById("summary").textContent = "불러오지 못했어요";
          var content = document.getElementById("content");
          content.className = "state error";
          content.textContent = message;
        }

        if (!window.UNIVERSE_CART_CONFIG) {
          fail("config.js 가 없어요. 배포 설정을 확인해 주세요.");
          return;
        }

        var script = document.createElement("script");
        script.src = "./share.js?v=5";
        script.onload = function () {
          if (!window.UCShareApp || !window.UCShareApp.boot) {
            fail("share.js 가 실행되지 않았어요. 새로고침해 주세요.");
          }
        };
        script.onerror = function () {
          fail("share.js 를 불러오지 못했어요. 네트워크 연결을 확인해 주세요.");
        };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
